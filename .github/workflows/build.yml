name: Build and validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.13.6'
          enable-cache: true
      - name: Install GNU gettext
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: Install locked build dependencies
        run: uv sync --locked
      - name: Generate translation template
        run: uv run --locked scons pot
      - name: Validate sources and translations
        run: uv run --locked python tools/check_project.py
      - name: Test runtime integration with NVDA doubles
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Build add-on
        run: uv run --locked scons
      - name: Validate package and write checksum
        run: uv run --locked python tools/check_project.py --package --write-checksum
      - name: Upload build for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: globalSonicPitch-${{ github.sha }}
          path: |
            globalSonicPitch-*.nvda-addon
            globalSonicPitch-*.nvda-addon.sha256
            nvda.pot
          if-no-files-found: error
          retention-days: 14
